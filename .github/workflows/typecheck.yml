name: typecheck

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck (shared, server, client)
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build client
        run: npm run build
