name: release

# Реліз = тег vX.Y.Z:  git tag v1.0.0 && git push --tags
# тег -> перевірки -> образ у GHCR -> деплой на Fly -> smoke-перевірка живого URL.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

env:
  FLY_APP: ${{ vars.FLY_APP }} # змінна репозиторію: ім'я застосунку з fly.toml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy образу з GHCR
        run: flyctl deploy --app "$FLY_APP" --image "${{ needs.image.outputs.image }}:${{ github.ref_name }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Smoke-перевірка живого URL
        run: |
          url="https://${FLY_APP}.fly.dev"
          for i in $(seq 1 20); do
            body=$(curl -fsS "$url/health" || true)
            echo "$body"
            if echo "$body" | grep -q "\"sha\":\"${GITHUB_SHA}\""; then
              curl -fsS "$url/ready" && echo "OK: $url віддає sha ${GITHUB_SHA}" && exit 0
            fi
            sleep 6
          done
          echo "::error::живий сервіс не віддає очікуваний sha"
          exit 1
