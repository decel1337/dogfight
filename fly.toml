# Fly.io. ПЕРЕД першим деплоєм: замініть app на унікальне ім'я (`fly apps create <ім'я>`).
app = "dogfight-REPLACE-ME"
primary_region = "waw"          # Варшава; будь-який регіон поруч із гравцями

# Образ збирає GitHub Actions (release.yml) і публікує в GHCR; деплой — `flyctl deploy --image`.
kill_signal = "SIGTERM"
kill_timeout = 10               # секунд на graceful shutdown до SIGKILL

[env]
  HOST = "0.0.0.0"
  PORT = "3000"
  LOG_LEVEL = "info"
  TRUST_PROXY = "1"             # за проксі Fly: IP клієнта з X-Forwarded-For
  # Той самий origin дозволений автоматично; список потрібен лише для інших доменів:
  # ALLOWED_ORIGINS = "https://dogfight.example.com"

[http_service]
  internal_port = 3000
  force_https = true            # wss:// замість ws://
  # Гра тримає стан у пам'яті: зупинка «за відсутності трафіку» вбила б кімнати.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/ready"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
